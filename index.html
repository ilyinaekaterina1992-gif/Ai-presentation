<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f7">
  <title>Центр-инвест — Студия презентаций</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261002">
  <link rel="stylesheet" href="ui-refresh.css?v=20261002">
</head>
<body>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2.5"/><rect x="14" y="3" width="7" height="7" rx="2.5"/><rect x="3" y="14" width="7" height="7" rx="2.5"/><rect x="14" y="14" width="7" height="7" rx="2.5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m3.5 17.5 5.3-5.3 3.7 3.1 3.1-4 4.9 6.2"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="i-templates" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 9v12"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3V7Z"/></symbol>
    <symbol id="i-type" viewBox="0 0 24 24"><path d="M4 6V4h16v2M12 4v16m-4 0h8"/></symbol>
    <symbol id="i-shape" viewBox="0 0 24 24"><rect x="3" y="3" width="14" height="14" rx="2"/><circle cx="17" cy="17" r="4"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8 8 4 12l4 4M4 12h10a6 6 0 0 1 0 12" transform="translate(0,-4)"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="m16 8 4 4-4 4m4-4H10a6 6 0 0 0 0 12" transform="translate(0,-4)"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="m12 2 1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2ZM19 17l.6 1.4L21 19l-1.4.6L19 21l-.6-1.4L17 19l1.4-.6L19 17Z"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m3 11 18-8-8 18-2.5-7.5L3 11Zm7.5 2.5L21 3"/></symbol>
  </svg>

  <div id="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="assets/centrinvest-logo.svg" alt="Банк Центр-инвест" width="140" height="30">
        <span class="brand-label">СТУДИЯ<br>ПРЕЗЕНТАЦИЙ</span>
      </div>
      <div class="top-divider"></div>
      <div class="document-title-wrap">
        <span class="document-eyebrow">ПРЕЗЕНТАЦИЯ</span>
        <input id="project-title" class="document-title" aria-label="Название презентации" value="Новая презентация" maxlength="90">
      </div>
      <div class="top-actions">
        <span id="save-status" class="save-status"><span class="save-dot"></span> Сохранено локально</span>
        <button id="present-btn" class="button button-ghost" type="button"><svg class="icon"><use href="#i-play"/></svg><span>Показать</span></button>
        <div class="export-wrap">
          <button id="export-btn" class="button button-primary" type="button" aria-expanded="false"><svg class="icon"><use href="#i-download"/></svg><span>Экспорт</span></button>
          <div id="export-menu" class="export-menu hidden">
            <button type="button" data-export="pdf">PDF <small>документ для просмотра</small></button>
            <button type="button" data-export="pptx">PPTX <small>Microsoft PowerPoint</small></button>
            <button type="button" data-export="odp">ODP <small>LibreOffice Impress</small></button>
          </div>
        </div>
        <button id="mobile-menu" class="icon-button mobile-menu" type="button" aria-label="Открыть меню"><svg class="icon"><use href="#i-menu"/></svg></button>
      </div>
    </header>

    <div class="workspace">
      <aside id="sidebar" class="sidebar">
        <nav class="nav-rail" aria-label="Разделы редактора">
          <button class="rail-item" type="button" data-panel="projects" title="Проекты"><svg class="icon"><use href="#i-grid"/></svg><span>Проекты</span></button>
          <button class="rail-item active" type="button" data-panel="templates" title="Шаблоны"><svg class="icon"><use href="#i-templates"/></svg><span>Шаблоны</span></button>
          <button class="rail-item" type="button" data-panel="images" title="Изображения"><svg class="icon"><use href="#i-image"/></svg><span>Картинки</span></button>
          <button class="rail-item" type="button" data-panel="partners" title="Партнёры"><svg class="icon"><use href="#i-layers"/></svg><span>Партнёры</span></button>
        </nav>
        <div id="library-panel" class="library-panel"></div>
      </aside>

      <main class="editor">
        <div class="editor-toolbar">
          <div class="toolbar-group">
            <button id="add-text" class="tool-button" type="button"><svg class="icon"><use href="#i-type"/></svg>Текст</button>
            <div class="shape-tool"><button id="add-shape" class="tool-button" type="button" aria-haspopup="menu" aria-expanded="false"><svg class="icon"><use href="#i-shape"/></svg>Фигура<svg class="icon shape-chevron"><use href="#i-chevron"/></svg></button><div id="shape-menu" class="shape-menu hidden" role="menu" aria-label="Добавить фигуру"></div></div>
            <span class="tool-separator"></span>
            <button id="undo" class="icon-button" type="button" title="Отменить" aria-label="Отменить"><svg class="icon"><use href="#i-undo"/></svg></button>
            <button id="redo" class="icon-button" type="button" title="Повторить" aria-label="Повторить"><svg class="icon"><use href="#i-redo"/></svg></button>
          </div>
          <div class="toolbar-right"><span class="canvas-label">ХОЛСТ 16:9</span><button id="properties-toggle" class="tool-button properties-toggle" type="button">Свойства</button></div>
        </div>

        <div id="stage" class="stage">
          <div class="stage-topline"><span class="stage-indicator"></span><span id="stage-caption">Слайд 1</span><span class="stage-tip">Перетащите изображение на слайд</span></div>
          <div id="canvas-sizer" class="canvas-sizer"><div id="slide-canvas" class="slide-canvas" aria-label="Редактор слайда"></div></div>
          <div class="stage-bottomline"><span>Подсказка: дважды нажмите на текст, чтобы изменить его</span><span id="zoom-label">100%</span></div>
        </div>

        <div class="filmstrip-head"><div><span class="section-kicker">СТРУКТУРА</span><h2>Слайды <span id="slide-count"></span></h2></div><button id="add-slide" class="small-add" type="button"><svg class="icon"><use href="#i-plus"/></svg> Новый слайд</button></div>
        <div class="filmstrip-shell"><div id="filmstrip" class="filmstrip"></div></div>
      </main>

      <aside id="inspector" class="inspector">
        <div id="inspector-content"></div>
        <section class="assistant-panel" aria-labelledby="assistant-title">
          <div class="assistant-heading">
            <span class="assistant-icon"><svg class="icon"><use href="#i-sparkle"/></svg></span>
            <div><span class="assistant-kicker">ПОМОЩНИК</span><h2 id="assistant-title">Спросить ИИ</h2></div>
            <span class="assistant-soon">Скоро</span>
          </div>
          <label class="visually-hidden" for="assistant-message">Сообщение ИИ-помощнику</label>
          <div class="assistant-input-wrap">
            <textarea id="assistant-message" rows="2" placeholder="Помоги с текстом слайда..." aria-describedby="assistant-note"></textarea>
            <button type="button" disabled aria-label="Отправка пока недоступна"><svg class="icon"><use href="#i-send"/></svg></button>
          </div>
          <p id="assistant-note">Пока это макет: сообщения не отправляются.</p>
        </section>
      </aside>
    </div>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden" role="presentation"><div id="modal" class="modal" role="dialog" aria-modal="true"></div></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <div id="presentation" class="presentation hidden"><div id="presentation-slide" class="presentation-slide"></div><div class="presentation-controls"><button id="presentation-prev" class="icon-button" aria-label="Предыдущий слайд">‹</button><span id="presentation-counter"></span><button id="presentation-next" class="icon-button" aria-label="Следующий слайд">›</button><button id="presentation-close" class="icon-button" aria-label="Закрыть показ"><svg class="icon"><use href="#i-close"/></svg></button></div></div>
  <div id="print-pages" aria-hidden="true"></div>
  <input id="asset-upload" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
  <input id="project-import" type="file" accept="application/json,.json" hidden>
  <input id="template-import" type="file" accept=".pdf,.pptx,.odp,.png,.jpg,.jpeg,.webp,.gif,.svg,application/pdf,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.oasis.opendocument.presentation,image/png,image/jpeg,image/webp,image/gif,image/svg+xml" hidden>
  <script src="vendor/jszip.min.js" defer></script>
  <script src="vendor/pptxgen.min.js" defer></script>
  <script src="vendor/pdf-lib.min.js" defer></script>
  <script src="formats.js?v=20261002" defer></script>
  <script src="app.js?v=20261002" defer></script>
</body>
</html>
